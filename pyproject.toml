[project]
name = "oft"
version = "0.1.0"
description = "Hybrid forex trading bot + dashboard on OANDA v20"
readme = "README.md"
authors = [
    { name = "Olyad Boka", email = "olyadboka@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
]

[project.scripts]
oft = "oft:main"

[build-system]
requires = ["uv_build>=0.8.5,<0.9.0"]
build-backend = "uv_build"
